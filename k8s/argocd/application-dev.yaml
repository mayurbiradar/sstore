apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sstore-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mayurbiradar/sstore.git
    targetRevision: main
    path: helm/sstore
    helm:
      releaseName: sstore
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true