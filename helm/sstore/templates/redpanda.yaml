{{- if .Values.redpanda.enabled }}
# Redpanda — single-node Kafka-compatible broker for local/dev clusters.
# In production, swap to a 3-node Redpanda or a managed Kafka service.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.redpanda.image }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: admin}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
{{ toYaml .Values.redpanda.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: redpanda-storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redpanda.storage }}
{{- end }}
