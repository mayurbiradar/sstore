imagePullSecrets: []

secrets:
  useSealedSecrets: true
  postgresSecretName: postgres-secret
  keycloakSecretName: keycloak-secret
  orderServiceSecretName: order-service-secret
  grafanaSecretName: grafana-admin

sealedSecrets:
  postgres: {}
  keycloak: {}
  orderService: {}
  grafana: {}

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  defaultDatabase: default_db
  databases:
    - auth_db
    - order_db
    - product_db

keycloak:
  image: quay.io/keycloak/keycloak:26.3
  hostname: auth.sstore.local
  realm: sstore
  clientId: sstore-frontend
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

services:
  product-service:
    image: mayurb123/sstore:product-service
    port: 8082
    replicas: 1
    database: product_db
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  order-service:
    image: mayurb123/sstore:order-service
    port: 8083
    replicas: 1
    database: order_db
    stripeSecretKey: ""
    stripeSuccessUrl: https://app.sstore.local/order-success
    stripeCancelUrl: https://app.sstore.local/checkout
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  api-gateway:
    image: mayurb123/sstore:api-gateway
    port: 9090
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  frontend:
    image: mayurb123/sstore:frontend
    port: 80
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

hosts:
  frontend: app.sstore.local
  api: api.sstore.local
  keycloak: auth.sstore.local
  prometheus: prometheus.sstore.local
  grafana: grafana.sstore.local
  jaeger: jaeger.sstore.local
ingress:
  enabled: true
  className: nginx
  tlsSecretName: sstore-tls

bootstrap:
  enabled: true
  image: curlimages/curl:8.10.1

persistence:
  enabled: true

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

monitoring:
  enabled: true
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    grpcPort: 4317
    httpPort: 4318
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    otlpGrpcPort: 4317
    queryPort: 16686
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
  prometheus:
    image: prom/prometheus:v3.5.0
    port: 9090
    retention: 7d
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  grafana:
    image: grafana/grafana:12.1.1
    port: 3000
    adminUser: admin
    adminPassword: admin
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

postgresql:
  jdbcHost: postgres

namespaceOverride: ""
