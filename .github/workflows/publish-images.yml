name: Publish Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY_IMAGE: mayurb123/sstore
  AWS_HOSTNAME: ${{ vars.AWS_HOSTNAME || '3-110-217-46.sslip.io' }}
  VITE_KEYCLOAK_REALM: sstore
  VITE_KEYCLOAK_CLIENT_ID: sstore-frontend
  VITE_KEYCLOAK_GOOGLE_IDP_HINT: google

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS hostname
        run: |
          test -n "${AWS_HOSTNAME}" || {
            echo "Missing GitHub repository variable AWS_HOSTNAME"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:api-gateway

      - name: Build and push product service
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:product-service

      - name: Build and push order service
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:order-service

      - name: Build and push payment service
        uses: docker/build-push-action@v6
        with:
          context: ./services/payment-service
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:payment-service

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_IMAGE }}:frontend
          build-args: |
            VITE_API_GATEWAY_ENDPOINT=https://api.${{ env.AWS_HOSTNAME }}
            VITE_KEYCLOAK_URL=https://auth.${{ env.AWS_HOSTNAME }}
            VITE_KEYCLOAK_REALM=${{ env.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ env.VITE_KEYCLOAK_CLIENT_ID }}
            VITE_KEYCLOAK_GOOGLE_IDP_HINT=${{ env.VITE_KEYCLOAK_GOOGLE_IDP_HINT }}
