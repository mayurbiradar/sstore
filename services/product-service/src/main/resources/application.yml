server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

  application:
    name: ${SPRING_APPLICATION_NAME:product-service}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sstore}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/sstore/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:product-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegateClass: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.sstore.*,java.util,java.lang"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual
      missing-topics-fatal: false

topics:
  reviews: ${TOPICS_REVIEWS:reviews}
  orders: ${TOPICS_ORDERS:orders}

# Cross-service base URLs.
# product-service calls inventory-service directly (not through api-gateway)
# on product creation to auto-register the SKU in inventory_items.
services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}

flyway:
  enabled: ${FLYWAY_ENABLED:true}
  locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}
  validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
        show-details: always