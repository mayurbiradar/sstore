{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sstore
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.frontend }}, {{ .Values.hosts.api }}, {{ .Values.hosts.keycloak }}{{- if .Values.monitoring.enabled }}, {{ .Values.hosts.prometheus }}, {{ .Values.hosts.grafana }}, {{ .Values.hosts.jaeger }}{{- end }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: {{ .Values.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 9090
    - host: {{ .Values.hosts.keycloak }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
  {{- if .Values.monitoring.enabled }}
    - host: {{ .Values.hosts.prometheus }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: {{ .Values.monitoring.prometheus.port }}
    - host: {{ .Values.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.monitoring.grafana.port }}
    - host: {{ .Values.hosts.jaeger }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: {{ .Values.monitoring.jaeger.queryPort }}
{{- end }}
{{- end }}
