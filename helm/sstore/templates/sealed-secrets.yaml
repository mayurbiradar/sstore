{{- if .Values.secrets.useSealedSecrets }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.postgresSecretName }}
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  encryptedData:
    POSTGRES_USER: {{ required "sealedSecrets.postgres.POSTGRES_USER is required when sealed secrets are enabled" .Values.sealedSecrets.postgres.POSTGRES_USER | quote }}
    POSTGRES_PASSWORD: {{ required "sealedSecrets.postgres.POSTGRES_PASSWORD is required when sealed secrets are enabled" .Values.sealedSecrets.postgres.POSTGRES_PASSWORD | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.postgresSecretName }}
    type: Opaque
{{- if .Values.monitoring.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.keycloakSecretName }}
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  encryptedData:
    KC_DB_USERNAME: {{ required "sealedSecrets.keycloak.KC_DB_USERNAME is required when sealed secrets are enabled" .Values.sealedSecrets.keycloak.KC_DB_USERNAME | quote }}
    KC_DB_PASSWORD: {{ required "sealedSecrets.keycloak.KC_DB_PASSWORD is required when sealed secrets are enabled" .Values.sealedSecrets.keycloak.KC_DB_PASSWORD | quote }}
    KC_BOOTSTRAP_ADMIN_USERNAME: {{ required "sealedSecrets.keycloak.KC_BOOTSTRAP_ADMIN_USERNAME is required when sealed secrets are enabled" .Values.sealedSecrets.keycloak.KC_BOOTSTRAP_ADMIN_USERNAME | quote }}
    KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "sealedSecrets.keycloak.KC_BOOTSTRAP_ADMIN_PASSWORD is required when sealed secrets are enabled" .Values.sealedSecrets.keycloak.KC_BOOTSTRAP_ADMIN_PASSWORD | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.keycloakSecretName }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.orderServiceSecretName }}
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  encryptedData:
    STRIPE_SECRET_KEY: {{ required "sealedSecrets.orderService.STRIPE_SECRET_KEY is required when sealed secrets are enabled" .Values.sealedSecrets.orderService.STRIPE_SECRET_KEY | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.orderServiceSecretName }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.grafanaSecretName }}
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  encryptedData:
    GF_SECURITY_ADMIN_USER: {{ required "sealedSecrets.grafana.GF_SECURITY_ADMIN_USER is required when sealed secrets are enabled" .Values.sealedSecrets.grafana.GF_SECURITY_ADMIN_USER | quote }}
    GF_SECURITY_ADMIN_PASSWORD: {{ required "sealedSecrets.grafana.GF_SECURITY_ADMIN_PASSWORD is required when sealed secrets are enabled" .Values.sealedSecrets.grafana.GF_SECURITY_ADMIN_PASSWORD | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.grafanaSecretName }}
    type: Opaque
{{- end }}
{{- end }}
