databases:
  # ---------- Shared PostgreSQL Server (sstore) ----------
  # Keycloak will use "auth_db" (created by the DB init job below).
  - name: sstore
    plan: free
    databaseName: sstore          # primary DB
    user: admin                    # Postgres superuser
    ipAllowList: []                # only internal Render services can connect

services:
  # ---------- DB Init Job (one-time) ----------
  # Creates "auth_db" inside the shared Postgres so Keycloak has a place to store realms/users.
  - type: web
    name: sstore-db-init
    runtime: docker
    plan: free
    autoDeploy: false             # run manually after first deploy
    dockerContext: .              # repo root
    dockerfilePath: services/postgres/init/Dockerfile.init
    envVars:
      - key: PGPASSWORD
        fromDatabase:
          name: sstore
          property: password
      - key: PGHOST
        fromDatabase:
          name: sstore
          property: host
      - key: PGPORT
        fromDatabase:
          name: sstore
          property: port
      - key: PGUSER
        fromDatabase:
          name: sstore
          property: user
      - key: INIT_DATABASES
        value: "auth_db"

  # ---------- Keycloak (Auth) ----------
  # Listens on Render's $PORT (default 10000) so Render can route traffic to it.
  - type: web
    name: sstore-keycloak
    runtime: docker
    plan: free
    dockerContext: .              # repo root
    dockerfilePath: services/keycloak/Dockerfile
    healthCheckPath: /realms/master
    envVars:
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin
      - key: KEYCLOAK_URL
        value: http://localhost:8080
      # Production-mode Postgres connection
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        value: "jdbc:postgresql://${SSTORE_DB_HOST}:${SSTORE_DB_PORT}/auth_db"
      - key: KC_DB_USERNAME
        fromDatabase:
          name: sstore
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: sstore
          property: password

  # ---------- Keycloak Bootstrap Job (one-time) ----------
  # Runs after Keycloak is live. Creates the "sstore" realm and "sstore-frontend" client.
  - type: web
    name: sstore-keycloak-bootstrap
    runtime: docker
    plan: free
    autoDeploy: false             # run manually after Keycloak is "Live"
    dockerContext: .              # repo root
    dockerfilePath: services/keycloak/Dockerfile.bootstrap
    envVars:
      # Render services communicate internally on $PORT (default 10000).
      - key: KEYCLOAK_URL
        value: "http://sstore-keycloak:10000"
      - key: KEYCLOAK_PUBLIC_URL
        fromService:
          type: web
          name: sstore-keycloak
          property: host
      - key: KEYCLOAK_REALM
        value: sstore
      - key: KEYCLOAK_CLIENT_ID
        value: sstore-frontend
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: admin
      # Comma-separated list of allowed frontend origins.
      # Vercel production + preview deployments are both allowed.
      - key: ALLOWED_REDIRECT_ORIGINS
        value: "http://localhost,http://localhost:5173,http://localhost:4173,https://sstore-pearl.vercel.app,https://*.vercel.app"