{{- range $name, $config := .Values.services }}
{{- if ne $name "frontend" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "sstore.labels" $ | nindent 4 }}
data:
  SERVER_PORT: {{ $config.port | quote }}
  {{- if eq $name "product-service" }}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{ $config.database }}
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SPRING_APPLICATION_NAME: product-service
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  {{- else if eq $name "order-service" }}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{ $config.database }}
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SPRING_APPLICATION_NAME: order-service
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  TOPICS_ORDERS: orders
  TOPICS_PAYMENTS: payments
  SERVICES_INVENTORY_BASE_URL: http://inventory-service:8085
  SERVICES_PAYMENT_BASE_URL: http://payment-service:8084
  {{- else if eq $name "payment-service" }}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{ $config.database }}
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SPRING_APPLICATION_NAME: payment-service
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  TOPICS_ORDERS: orders
  TOPICS_PAYMENTS: payments
  RAZORPAY_CURRENCY: {{ $config.razorpayCurrency | quote }}
  RAZORPAY_COMPANY_NAME: {{ $config.razorpayCompanyName | quote }}
  {{- else if eq $name "inventory-service" }}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{ $config.database }}
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SPRING_APPLICATION_NAME: inventory-service
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  TOPICS_ORDERS: orders
  TOPICS_PAYMENTS: payments
  RESERVATION_TTL_MINUTES: "15"
  {{- else if eq $name "review-service" }}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/{{ $config.database }}
  JPA_DDL_AUTO: validate
  JPA_SHOW_SQL: "false"
  SPRING_APPLICATION_NAME: review-service
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  TOPICS_REVIEWS: reviews
  TOPICS_ORDERS: orders
  REVIEW_MODERATION_POLICY: {{ $config.moderationPolicy | quote }}
  REVIEW_REQUIRE_PURCHASE: {{ $config.requirePurchase | quote }}
  REVIEW_EDIT_WINDOW_DAYS: {{ $config.editWindowDays | quote }}
  REVIEW_HELPFUL_VOTE_ENABLED: {{ $config.helpfulVoteEnabled | quote }}
  REVIEW_HELPFUL_VOTE_REQUIRE_LOGIN: {{ $config.helpfulVoteRequireLogin | quote }}
  REVIEW_RATING_MIN: {{ $config.ratingMin | quote }}
  REVIEW_RATING_MAX: {{ $config.ratingMax | quote }}
  REVIEW_TITLE_MIN: {{ $config.titleMin | quote }}
  REVIEW_TITLE_MAX: {{ $config.titleMax | quote }}
  REVIEW_BODY_MIN: {{ $config.bodyMin | quote }}
  REVIEW_BODY_MAX: {{ $config.bodyMax | quote }}
  {{- else }}
  PRODUCT_SERVICE_URL: http://product-service:8082
  ORDER_SERVICE_URL: http://order-service:8083
  PAYMENT_SERVICE_URL: http://payment-service:8084
  INVENTORY_SERVICE_URL: http://inventory-service:8085
  REVIEW_SERVICE_URL: http://review-service:8086
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: {{ $.Values.keycloak.realm | quote }}
  KEYCLOAK_ISSUER_URI: https://{{ $.Values.hosts.keycloak }}/realms/{{ $.Values.keycloak.realm }}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/{{ $.Values.keycloak.realm }}/protocol/openid-connect/certs
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sstore.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $config.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sstore.labels" $ | nindent 4 }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $config.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://otel-collector:%v" $.Values.monitoring.otelCollector.grpcPort | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none(eq $name "review-service") 
          {{- if or (eq $name "product-service") (eq $name "order-service") (eq $name "payment-service") (eq $name "inventory-service") }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.postgresSecretName }}, key: POSTGRES_USER}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.secrets.postgresSecretName }}, key: POSTGRES_PASSWORD}}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $config.port }}
          {{- if ne $name "frontend" }}
          envFrom:
            - configMapRef: {name: {{ $name }}-config}
          {{- if eq $name "payment-service" }}
            - secretRef: {name: {{ $.Values.secrets.paymentServiceSecretName }}}
          {{- end }}
          {{- end }}
          resources:
{{ toYaml $config.resources | indent 12 }}
          {{- if eq $name "api-gateway" }}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 40, periodSeconds: 20}
          {{- end }}
---
{{- end }}
{{- if not .Values.secrets.useSealedSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.paymentServiceSecretName }}
  labels:
  {{- include "sstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAZORPAY_KEY_ID: {{ (index .Values.services "payment-service").razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ (index .Values.services "payment-service").razorpayKeySecret | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ (index .Values.services "payment-service").razorpayWebhookSecret | quote }}
{{- end }}
