{{- if not .Values.secrets.useSealedSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  KC_DB_USERNAME: {{ .Values.postgres.username | quote }}
  KC_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUsername | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
data:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/auth_db
  KC_HEALTH_ENABLED: "true"
  KC_HOSTNAME: {{ .Values.keycloak.hostname | quote }}
  KC_HOSTNAME_STRICT: "false"
  KC_PROXY_HEADERS: xforwarded
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8080"
  KC_HTTP_MANAGEMENT_PORT: "9000"
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: [sh, -c, 'until pg_isready -h postgres -p 5432; do sleep 2; done']
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start-dev]
          envFrom:
            - configMapRef: {name: keycloak-config}
            - secretRef: {name: {{ .Values.secrets.keycloakSecretName }}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          resources:
{{ toYaml .Values.keycloak.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            initialDelaySeconds: 90
            periodSeconds: 20
