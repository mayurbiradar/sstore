{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.monitoring.otelCollector.grpcPort }}
          http:
            endpoint: 0.0.0.0:{{ .Values.monitoring.otelCollector.httpPort }}
    processors:
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger:{{ .Values.monitoring.jaeger.otlpGrpcPort }}
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.monitoring.otelCollector.grpcPort }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.monitoring.otelCollector.httpPort }}
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.monitoring.otelCollector.image }}
          args: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.monitoring.otelCollector.grpcPort }}
            - name: otlp-http
              containerPort: {{ .Values.monitoring.otelCollector.httpPort }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
              readOnly: true
          resources:
{{ toYaml .Values.monitoring.otelCollector.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.monitoring.jaeger.otlpGrpcPort }}
      targetPort: otlp-grpc
    - name: query
      port: {{ .Values.monitoring.jaeger.queryPort }}
      targetPort: query
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.monitoring.jaeger.image }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.monitoring.jaeger.otlpGrpcPort }}
            - name: query
              containerPort: {{ .Values.monitoring.jaeger.queryPort }}
          resources:
{{ toYaml .Values.monitoring.jaeger.resources | indent 12 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: sstore-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - api-gateway:9090
            labels:
              service: api-gateway
          - targets:
              - product-service:8082
            labels:
              service: product-service
          - targets:
              - order-service:8083
            labels:
              service: order-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
{{- if not .Values.secrets.useSealedSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.grafanaSecretName }}
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.monitoring.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.monitoring.grafana.adminPassword | quote }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.monitoring.prometheus.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.prometheus.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources:
{{ toYaml .Values.monitoring.prometheus.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.monitoring.grafana.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "sstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.grafanaSecretName }}
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.grafana.port }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 40, periodSeconds: 20}
          resources:
{{ toYaml .Values.monitoring.grafana.resources | indent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasource
          configMap:
            name: grafana-datasource
{{- end }}