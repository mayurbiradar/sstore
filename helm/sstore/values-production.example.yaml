# Copy this file to a private values-production.yaml and replace every placeholder.
postgres:
  storage: 20Gi

keycloak:
  hostname: auth.example.com

hosts:
  frontend: shop.example.com
  api: api.example.com
  keycloak: auth.example.com
  prometheus: prometheus.example.com
  grafana: grafana.example.com

ingress:
  tlsSecretName: sstore-production-tls

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

services:
  product-service:
    image: mayurb123/sstore:product-service
    replicas: 2
  order-service:
    image: mayurb123/sstore:order-service
    replicas: 2
    stripeSecretKey: replace-me
  api-gateway:
    image: mayurb123/sstore:api-gateway
    replicas: 2
  frontend:
    image: mayurb123/sstore:frontend
    replicas: 2
