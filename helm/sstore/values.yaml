imagePullSecrets: []

secrets:
  useSealedSecrets: true
  postgresSecretName: postgres-secret
  keycloakSecretName: keycloak-secret
  orderServiceSecretName: order-service-secret
  paymentServiceSecretName: payment-service-secret
  grafanaSecretName: grafana-admin

sealedSecrets:
  postgres: {}
  keycloak: {}
  orderService: {}
  paymentService: {}
  grafana: {}

redpanda:
  enabled: true
  image: redpandadata/redpanda:v24.3.7
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  defaultDatabase: default_db
  databases:
    - auth_db
    - order_db
    - product_db
    - payment_db
    - inventory_db
    - review_db

keycloak:
  image: quay.io/keycloak/keycloak:26.3
  hostname: auth.sstore.local
  realm: sstore
  clientId: sstore-frontend
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

services:
  product-service:
    image: mayurb123/sstore:product-service
    port: 8082
    replicas: 1
    database: product_db
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  order-service:
    image: mayurb123/sstore:order-service
    port: 8083
    replicas: 1
    database: order_db
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  payment-service:
    image: mayurb123/sstore:payment-service
    port: 8084
    replicas: 1
    database: payment_db
    razorpayKeyId: ""
    razorpayKeySecret: ""
    razorpayWebhookSecret: ""
    razorpayCurrency: INR
    razorpayCompanyName: SStore
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  inventory-service:
    image: mayurb123/sstore:inventory-service
    port: 8085
    replicas: 1
    database: inventory_db
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  api-gateway:
    image: mayurb123/sstore:api-gateway
    port: 9090
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  review-service:
    image: mayurb123/sstore:review-service
    port: 8086
    replicas: 1
    database: review_db
    moderationPolicy: AUTO_APPROVE      # AUTO_APPROVE | ALWAYS_PENDING | ALWAYS_APPROVE
    requirePurchase: true
    editWindowDays: 30
    helpfulVoteEnabled: true
    helpfulVoteRequireLogin: true
    ratingMin: 1
    ratingMax: 5
    titleMin: 3
    titleMax: 120
    bodyMin: 10
    bodyMax: 4000
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  frontend:
    image: mayurb123/sstore:frontend
    port: 80
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

hosts:
  frontend: app.sstore.local
  api: api.sstore.local
  keycloak: auth.sstore.local
  prometheus: prometheus.sstore.local
  grafana: grafana.sstore.local
  jaeger: jaeger.sstore.local
ingress:
  enabled: true
  className: nginx
  tlsSecretName: sstore-tls

bootstrap:
  enabled: true
  image: curlimages/curl:8.10.1

persistence:
  enabled: true

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

monitoring:
  enabled: true
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    grpcPort: 4317
    httpPort: 4318
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    otlpGrpcPort: 4317
    queryPort: 16686
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
  prometheus:
    image: prom/prometheus:v3.5.0
    port: 9090
    retention: 7d
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  grafana:
    image: grafana/grafana:12.1.1
    port: 3000
    adminUser: admin
    adminPassword: admin
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}

postgresql:
  jdbcHost: postgres

namespaceOverride: ""
